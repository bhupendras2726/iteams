services:
  frontend:
    image: ghcr.io/bhupendras2726/iteams-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    image: ghcr.io/bhupendras2726/iteams-backend:latest
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: iteams_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - iteams_postgres_data:/var/lib/postgresql

volumes:
  iteams_postgres_data: